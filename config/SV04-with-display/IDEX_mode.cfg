# This file contains a configuration snippet for a dual extruder
# printer using dual carriages (an "IDEX" printer).

# See docs/Config_Reference.md for a description of parameters.

# Definition for the primary carriage (holding the primary extruder)
# and the definition for the primary extruder in main config file


# T0 print cooling fan
[fan_generic fanX1]
pin: PB14
cycle_time: 0.0100
kick_start_time: 1.00
hardware_pwm: false

# T1 print  cooling fan
[fan_generic fanX2]
pin: PB12
cycle_time: 0.0100
kick_start_time: 1.000
hardware_pwm: false

########################################
# DUAL-CARRIAGES
########################################

[respond]

[gcode_macro DC_VARS]
# T1 offsets are stored in variables.cfg (see SET_OFFSET_T1)
# Autopark parameters
## default autopark: 0:inactive - 1:active
variable_autopark: 1
variable_z_hop: 2.0
variable_movespeed: 500
variable_feedrate: 30000
# HeatBed size
variable_bed_x_min: 0
variable_bed_x_max: 302
# Print cooling fans names
variable_fan0: 'fanX1'
variable_fan1: 'fanX2'
# Extruders temp
variable_offset_temp: 0
gcode:

## T1 offsets (X/Y/Z relative to T0), stored in variables.cfg

[gcode_macro SET_OFFSET_T1]
description: Save the X/Y/Z offset of the right nozzle (T1) relative to T0. Omitted values stay unchanged
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    {% set sv = printer.save_variables.variables %}
    {% set x = params.X|default(sv.dual_x_offset|default(0))|float %}
    {% set y = params.Y|default(sv.dual_y_offset|default(0))|float %}
    {% set z = params.Z|default(sv.dual_z_offset|default(0))|float %}
    SAVE_VARIABLE VARIABLE=dual_x_offset VALUE={x}
    SAVE_VARIABLE VARIABLE=dual_y_offset VALUE={y}
    SAVE_VARIABLE VARIABLE=dual_z_offset VALUE={z}
    RESPOND MSG="T1 offset saved: X={'%.3f' % x} Y={'%.3f' % y} Z={'%.3f' % z}"
    # a new absolute T1 Z value replaces an unsaved T1 babystep
    {% set clear = 1 if params.Z is defined else 0 %}
    {% if printer.dual_carriage.carriage_1 == "PRIMARY" %}
        _SOVOL_TOOL_OFFSET TOOL=1 CLEAR_BABY={clear}
    {% elif clear %}
        SET_GCODE_VARIABLE MACRO=_SOVOL_TOOL_OFFSET VARIABLE=baby1 VALUE=0.0
    {% endif %}

[gcode_macro XY_offset_dual]
description: Old name, use SET_OFFSET_T1. Set XY offset for dual mode
gcode:
    SET_OFFSET_T1 X={params.X_OFFSET|default(0)|float} Y={params.Y_OFFSET|default(0)|float}

# Z offset bookkeeping. G-code Z offset = sync_z + baby0 (+ dual_z_offset + baby1 while T1 is active)
#   sync_z     measured but not yet saved probe z_offset (both nozzles)
#   baby0      babystep made while T0 (or COPY/MIRROR) prints: corrects the reference -> both nozzles
#   baby1      babystep made while T1 prints: corrects only T1 relative to T0
#   applied_z  dual_z_offset currently included (0 while T0 is active)
#   tool       active tool 0/1
# Babysteps stay until they are saved (SAVE_Z_OFFSET / Mainsail save button) or Klipper restarts.
[gcode_macro _SOVOL_TOOL_OFFSET]
description: Apply the offsets of a tool (T1 X/Y/Z offset, babysteps)
variable_applied_z: 0.0
variable_tool: 0
variable_baby0: 0.0
variable_baby1: 0.0
variable_sync_z: 0.0
gcode:
    {% set new = params.TOOL|default(0)|int %}
    {% set sv = printer.save_variables.variables %}
    {% set hz = printer.gcode_move.homing_origin.z|float %}
    {% if tool|int == 1 %}
        {% set b0 = baby0|float %}
        {% set b1 = hz - sync_z|float - b0 - applied_z|float %}
    {% else %}
        {% set b0 = hz - sync_z|float %}
        {% set b1 = baby1|float %}
    {% endif %}
    {% if params.CLEAR_BABY|default(0)|int == 1 %}
        {% if new == 1 %}{% set b1 = 0.0 %}{% else %}{% set b0 = 0.0 %}{% endif %}
    {% endif %}
    {% set x = sv.dual_x_offset|default(0)|float if new == 1 else 0.0 %}
    {% set y = sv.dual_y_offset|default(0)|float if new == 1 else 0.0 %}
    {% set dz = sv.dual_z_offset|default(0)|float if new == 1 else 0.0 %}
    {% set z = sync_z|float + b0 + (dz + b1 if new == 1 else 0.0) %}
    SET_GCODE_OFFSET X={x} Y={y} Z={'%.4f' % z}
    SET_GCODE_VARIABLE MACRO=_SOVOL_TOOL_OFFSET VARIABLE=applied_z VALUE={dz}
    SET_GCODE_VARIABLE MACRO=_SOVOL_TOOL_OFFSET VARIABLE=tool VALUE={new}
    SET_GCODE_VARIABLE MACRO=_SOVOL_TOOL_OFFSET VARIABLE=baby0 VALUE={'%.4f' % b0}
    SET_GCODE_VARIABLE MACRO=_SOVOL_TOOL_OFFSET VARIABLE=baby1 VALUE={'%.4f' % b1}

[gcode_macro _SOVOL_TOOL_OFFSET_RESET]
description: Back to the T0 offsets (print start/end). Babysteps of both nozzles are kept
gcode:
    _SOVOL_TOOL_OFFSET TOOL=0

## DUAL-CARRIAGES : FULL_CONTROL - AUTO-PARK

[gcode_macro T0]
description: Activate the left nozzle (T0)
gcode:
    {% if printer.dual_carriage is defined and printer.dual_carriage.carriage_1 == "PRIMARY" %}
        _SOVOL_TOOLCHANGE TOOL=0
    {% endif %}

[gcode_macro T1]
description: Activate the right nozzle (T1)
gcode:
    {% if printer.dual_carriage is defined and printer.dual_carriage.carriage_0 == "PRIMARY" %}
        _SOVOL_TOOLCHANGE TOOL=1
    {% endif %}

# Tool change: lift, park the old head, switch carriage, apply the offsets of the new
# tool and move back to exactly the same G-code position (X, Y and Z). Z is restored
# during prints as well, so the new tool never stays lifted and its Z offset is active
# immediately - independent of whether the slicer sends a Z move after the tool change.
[gcode_macro _SOVOL_TOOLCHANGE]
gcode:
    {% set tool = params.TOOL|int %}
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set moves = dcvars.autopark == 1 and printer.toolhead.homed_axes == "xyz" %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set room = printer.toolhead.axis_maximum.z|float - printer.toolhead.position.z|float %}
    {% set hop = [dcvars.z_hop|float, room]|min if moves else 0.0 %}
    M400
    SAVE_GCODE_STATE NAME=_sovol_toolchange
    {% if moves %}
        G91
        G1 Z{hop} F1200
        G90
        _PARK_TOOL
    {% endif %}
    ACTIVATE_EXTRUDER EXTRUDER={"extruder" if tool == 0 else "extruder1"}
    SET_DUAL_CARRIAGE CARRIAGE={tool}
    # modes, speed and offsets as before the change (no move), then the offsets of the new tool
    RESTORE_GCODE_STATE NAME=_sovol_toolchange
    _SOVOL_TOOL_OFFSET TOOL={tool}
    _SOVOL_APPLY_SHAPER
    _SET_PRINT_FANS_SPEED
    {% if moves %}
        _SOVOL_TOOLCHANGE_RETURN X={pos.x} Y={pos.y} Z={pos.z} HOP={hop}
    {% endif %}

[gcode_macro _SOVOL_TOOLCHANGE_RETURN]
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set z = params.Z|float %}
    SAVE_GCODE_STATE NAME=_sovol_return
    G90
    G1 X{params.X} Y{params.Y} Z{z + params.HOP|float} F{dcvars.feedrate}
    G1 Z{z} F1200
    RESTORE_GCODE_STATE NAME=_sovol_return

[gcode_macro _PARK_TOOL]
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% if printer.dual_carriage is defined %}
        SAVE_GCODE_STATE NAME=park_tool
        SET_GCODE_OFFSET X=0 Y=0 Z=0
        G90
        {% if printer.toolhead.extruder == 'extruder' %}
            G1 X{printer.configfile.config.stepper_x.position_endstop} F{dcvars.feedrate}
        {% elif (printer.toolhead.extruder) == 'extruder1' %}
            G1 X{printer.configfile.config.dual_carriage.position_endstop} F{dcvars.feedrate}
        {% else %}
            RESPOND TYPE=error MSG={ "Unknown extruder: %s".format(printer.toolhead.extruder) }
        {% endif %}
        RESTORE_GCODE_STATE NAME=park_tool
    {% endif %}
    
## DUAL-CARRIAGES : MODES ACTIVATION

[gcode_macro M605]
description: Set the dual-carriages mode
gcode:
    {% set mode = params.S|default(1)|int %}
    {% set offset_temp = params.R|default(0)|float %}
    {% if printer.dual_carriage is defined %}
        {% if (mode) == 0 %}
            SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=autopark VALUE=0
            MODE_FULL_CONTROL
        {% elif (mode) == 1 %}
            SET_GCODE_VARIABLE MACRO=DC_VARS VARIABLE=autopark VALUE=1
            MODE_FULL_CONTROL
        {% elif (mode) == 2 and (params.X) is defined %}
            ACTIVATE_COPY_MODE X={params.X} R={offset_temp}
        {% elif (mode) == 2 %}
            ACTIVATE_COPY_MODE R={offset_temp}
        {% elif (mode) == 3 %}
            ACTIVATE_MIRROR_MODE R={offset_temp}
        {% endif %}
        G1 F3000
    {% endif %}

[gcode_macro ACTIVATE_COPY_MODE]
description: Set the dual-carriages mode to "DUPLICATION"
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set bed_x_mid = 0.5 * (dcvars.bed_x_max|float - dcvars.bed_x_min|float) %}
    {% set offset_temp = params.R|default(0)|float %}
    {% if printer.dual_carriage is defined %}
       SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
       G1 X{dcvars.bed_x_min|float} F{dcvars.feedrate}
       ACTIVATE_EXTRUDER EXTRUDER=extruder
       SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
       G1 X{params.X|default(bed_x_mid)|float} F{dcvars.feedrate}
       SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
       SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
       _SOVOL_APPLY_SHAPER
       M117 Copy Mode
    {% endif %}

[gcode_macro ACTIVATE_MIRROR_MODE]
description: Set the dual-carriages mode to "MIRRORED"
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set offset_temp = params.R|default(0)|float %}
    {% if printer.dual_carriage is defined %}
       SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
       G1 X{dcvars.bed_x_min|float} F{dcvars.feedrate}
       ACTIVATE_EXTRUDER EXTRUDER=extruder
       SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
       G1 X{dcvars.bed_x_max|float} F{dcvars.feedrate}
       SET_DUAL_CARRIAGE CARRIAGE=1 MODE=MIRROR
       SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder
       _SOVOL_APPLY_SHAPER
       M117 Mirror Mode
    {% endif %}
    
## DUAL-CARRIAGES : PRINT FANS MANAGEMENT

[gcode_macro M106]
description: Override "M106" to allow multiple extruders.
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set raw_speed = params.S|default(0)|float %}
    {% set fan_speed = (raw_speed / 255.0)|round(2) %}
    {% if (params.P) is defined %}
        {% set P_fan = dcvars.fan0 if (params.P)|int == 0 else dcvars.fan1 %}
        SET_FAN_SPEED FAN={P_fan} SPEED={fan_speed}
    {% elif printer.dual_carriage is defined %}
        _SET_PRINT_FANS_SPEED SPEED={fan_speed}
    {% endif %}
    
[gcode_macro M107]
description: Override "M107" to allow multiple extruders.
gcode:
    M106 S0
    
[gcode_macro _SET_PRINT_FANS_SPEED]
gcode:
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% if params.SPEED is defined %}
        {% set fan_speed = params.SPEED|float %}
    {% else %}
        # read print fan speed from active extruder
        {% set fan0_speed = printer["fan_generic " + dcvars.fan0].speed|float %}
        {% set fan1_speed = printer["fan_generic " + dcvars.fan1].speed|float %}
        {% set fan_speed = [fan0_speed, fan1_speed]|max %}
    {% endif %}
    {% if printer.dual_carriage.carriage_1 == "MIRROR" %}
        SET_FAN_SPEED FAN={dcvars.fan0} SPEED={fan_speed}
        SET_FAN_SPEED FAN={dcvars.fan1} SPEED={fan_speed}
    {% elif printer.dual_carriage.carriage_1 == "COPY" %}
        SET_FAN_SPEED FAN={dcvars.fan0} SPEED={fan_speed}
        SET_FAN_SPEED FAN={dcvars.fan1} SPEED={fan_speed}
    {% elif printer.dual_carriage.carriage_1 == "INACTIVE" %}
        SET_FAN_SPEED FAN={dcvars.fan0} SPEED={fan_speed}
        SET_FAN_SPEED FAN={dcvars.fan1} SPEED=0
    {% elif printer.dual_carriage.carriage_0 == "INACTIVE" %}
        SET_FAN_SPEED FAN={dcvars.fan0} SPEED=0
        SET_FAN_SPEED FAN={dcvars.fan1} SPEED={fan_speed}
    {% endif %}

## DUAL-CARRIAGES : HEATERS MANAGEMENT
    
