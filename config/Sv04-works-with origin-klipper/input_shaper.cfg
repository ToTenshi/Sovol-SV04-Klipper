########################################################################
# INPUT SHAPER (resonance compensation)
#
# Works without a sensor: a conservative preset is active by default.
# With an ADXL345 (adxl345.cfg) or a ringing tower print you can store
# measured values per carriage - they replace the preset.
#
# Original Klipper does not allow shaper values in [input_shaper] together
# with [dual_carriage]. The values are therefore set at runtime with
# SET_INPUT_SHAPER for the active carriage(s) and stored in variables.cfg.
########################################################################

[input_shaper]
# intentionally empty - see _SOVOL_APPLY_SHAPER

[gcode_macro _SOVOL_SHAPER]
description: Input shaper preset (used for every axis without measured values)
# EI tolerates a wrong frequency much better than MZV - good for an estimate.
# X = gantry (both carriages), Y = bed. Allows about 1500 mm/s^2 acceleration.
variable_preset_type_x: "ei"
variable_preset_freq_x: 40.0
variable_preset_type_y: "ei"
variable_preset_freq_y: 30.0
gcode:
    G4

[gcode_macro _SOVOL_APPLY_SHAPER]
description: Apply the shaper values for the active carriage(s)
gcode:
    {% set p = printer["gcode_macro _SOVOL_SHAPER"] %}
    {% set sv = printer.save_variables.variables %}
    # T1 alone uses its own X values, T0 / COPY / MIRROR use the T0 values
    {% set xs = "x1" if printer.dual_carriage.carriage_1 == "PRIMARY" else "x0" %}
    {% set tx = sv["shaper_type_" ~ xs]|default("") %}
    {% set fx = sv["shaper_freq_" ~ xs]|default(0)|float %}
    {% if fx <= 0 or not tx %}
        {% set tx = p.preset_type_x %}
        {% set fx = p.preset_freq_x|float %}
    {% endif %}
    {% set ty = sv.shaper_type_y|default("") %}
    {% set fy = sv.shaper_freq_y|default(0)|float %}
    {% if fy <= 0 or not ty %}
        {% set ty = p.preset_type_y %}
        {% set fy = p.preset_freq_y|float %}
    {% endif %}
    SET_INPUT_SHAPER SHAPER_TYPE_X={tx} SHAPER_FREQ_X={fx} SHAPER_TYPE_Y={ty} SHAPER_FREQ_Y={fy}

[delayed_gcode _SOVOL_SHAPER_INIT]
initial_duration: 1
gcode:
    _SOVOL_APPLY_SHAPER

[gcode_macro INPUT_SHAPER_SET]
description: Store input shaper values. AXIS=X TOOL=0|1 or AXIS=Y, TYPE=mzv|ei|2hump_ei|zv, FREQ=Hz (FREQ=0 = back to preset)
gcode:
    {% set axis = params.AXIS|default("X")|upper %}
    {% set tool = params.TOOL|default(0)|int %}
    {% set type = params.TYPE|default("mzv")|lower %}
    {% set freq = params.FREQ|default(0)|float %}
    {% set key = "y" if axis == "Y" else "x%d" % tool %}
    RESPOND TYPE=command MSG=action:prompt_end
    {% if axis not in ["X", "Y"] or tool not in [0, 1] %}
        RESPOND TYPE=error MSG="Use AXIS=X TOOL=0, AXIS=X TOOL=1 or AXIS=Y"
    {% elif type not in ["zv", "mzv", "zvd", "ei", "2hump_ei", "3hump_ei"] %}
        RESPOND TYPE=error MSG="Unknown shaper type {type}"
    {% else %}
        {% if freq > 0 %}
            SAVE_VARIABLE VARIABLE=shaper_type_{key} VALUE="'{type}'"
            SAVE_VARIABLE VARIABLE=shaper_freq_{key} VALUE={freq}
            RESPOND MSG="Input shaper {key}: {type} {'%.1f' % freq} Hz saved"
        {% else %}
            SAVE_VARIABLE VARIABLE=shaper_type_{key} VALUE="''"
            SAVE_VARIABLE VARIABLE=shaper_freq_{key} VALUE=0
            RESPOND MSG="Input shaper {key}: back to preset"
        {% endif %}
        _SOVOL_APPLY_SHAPER
    {% endif %}

[gcode_macro INPUT_SHAPER_STATUS]
description: Show which input shaper values are used (measured or preset)
gcode:
    {% set p = printer["gcode_macro _SOVOL_SHAPER"] %}
    {% set sv = printer.save_variables.variables %}
    RESPOND TYPE=command MSG=action:prompt_end
    {% for key, label in [("x0", "X T0"), ("x1", "X T1"), ("y", "Y bed")] %}
        {% set t = sv["shaper_type_" ~ key]|default("") %}
        {% set f = sv["shaper_freq_" ~ key]|default(0)|float %}
        {% if f > 0 and t %}
            RESPOND MSG="{label}: {t} {'%.1f' % f} Hz (measured)"
        {% else %}
            {% set pt = p.preset_type_y if key == "y" else p.preset_type_x %}
            {% set pf = (p.preset_freq_y if key == "y" else p.preset_freq_x)|float %}
            RESPOND MSG="{label}: {pt} {'%.1f' % pf} Hz (preset)"
        {% endif %}
    {% endfor %}
    SET_INPUT_SHAPER

# SHAPER_CALIBRATE stores its result for SAVE_CONFIG in [input_shaper].
# With [dual_carriage], original Klipper would refuse to start afterwards,
# so SAVE_CONFIG is blocked until Klipper was restarted once.
[gcode_macro SAVE_CONFIG]
rename_existing: _SOVOL_SAVE_CONFIG_BASE
description: Save the configuration and restart (checks for pending input shaper values first)
gcode:
    {% if "input_shaper" in printer.configfile.save_config_pending_items %}
        RESPOND TYPE=error MSG="Input shaper values are pending for SAVE_CONFIG - they are already stored in variables.cfg. Run RESTART first, then repeat your calibration (e.g. Z offset) and save."
        RESPOND TYPE=command MSG="action:prompt_begin SAVE_CONFIG blocked"
        RESPOND TYPE=command MSG="action:prompt_text Measured input shaper values are stored in variables.cfg. Saving them to printer.cfg would stop Klipper from starting with dual_carriage. Restart Klipper once, then repeat other calibrations and save again."
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button RESTART|RESTART|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        _SOVOL_SAVE_CONFIG_BASE
    {% endif %}
