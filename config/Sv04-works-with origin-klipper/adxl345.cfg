########################################################################
# OPTIONAL: ADXL345 accelerometer for input shaper measurement
# Enable with [include adxl345.cfg] in printer.cfg.
#
# Wiring: ADXL345 on the SPI pins of the Raspberry Pi. The Pi must run as a
# second MCU ("klipper-mcu" service), see
# https://www.klipper3d.org/RPi_microcontroller.html and
# https://www.klipper3d.org/Measuring_Resonances.html
# Python packages for the evaluation (once, via SSH):
#   ~/klippy-env/bin/pip install numpy
#
# Measuring (results are stored in variables.cfg, not via SAVE_CONFIG):
#   SHAPER_CALIBRATE_SV04 AXIS=X TOOL=0   sensor on the left print head
#   SHAPER_CALIBRATE_SV04 AXIS=X TOOL=1   sensor on the right print head
#   SHAPER_CALIBRATE_SV04 AXIS=Y          sensor on the bed
########################################################################

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    150.5,160,100

[gcode_macro SHAPER_CALIBRATE_SV04]
description: Measure the input shaper with the ADXL345. AXIS=X TOOL=0|1 or AXIS=Y. Result is stored in variables.cfg
gcode:
    {% set axis = params.AXIS|default("X")|upper %}
    {% set tool = params.TOOL|default(0)|int %}
    RESPOND TYPE=command MSG=action:prompt_end
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="Not possible during a print"
    {% elif axis not in ["X", "Y"] or tool not in [0, 1] %}
        RESPOND TYPE=error MSG="Use AXIS=X TOOL=0, AXIS=X TOOL=1 or AXIS=Y"
    {% else %}
        RESPOND MSG="DO NOT TOUCH THE PRINTER UNTIL DONE"
        {% if printer.toolhead.homed_axes != "xyz" %}
            G28
        {% endif %}
        {% if axis == "X" and tool == 1 %}
            T1
        {% else %}
            T0
        {% endif %}
        SHAPER_CALIBRATE AXIS={axis}
        _SOVOL_SHAPER_STORE AXIS={axis} TOOL={tool}
        T0
    {% endif %}

[gcode_macro _SOVOL_SHAPER_STORE]
gcode:
    {% set axis = params.AXIS|upper %}
    {% set pending = printer.configfile.save_config_pending_items["input_shaper"]|default({}) %}
    {% set type = pending["shaper_type_" ~ axis|lower]|default("") %}
    {% set freq = pending["shaper_freq_" ~ axis|lower]|default(0)|float %}
    {% if freq > 0 and type %}
        INPUT_SHAPER_SET AXIS={axis} TOOL={params.TOOL|default(0)} TYPE={type} FREQ={freq}
        RESPOND TYPE=command MSG="action:prompt_begin Input shaper"
        RESPOND TYPE=command MSG="action:prompt_text Measured {axis}{' T' ~ params.TOOL if axis == 'X' else ''}: {type} {'%.1f' % freq} Hz - stored in variables.cfg and active."
        RESPOND TYPE=command MSG="action:prompt_text Klipper must restart once before the next SAVE_CONFIG (the measurement left a temporary entry). Measure the other axes first if you like."
        RESPOND TYPE=command MSG="action:prompt_footer_button Later|RESPOND TYPE=command MSG=action:prompt_end|secondary"
        RESPOND TYPE=command MSG="action:prompt_footer_button RESTART|RESTART|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% else %}
        RESPOND TYPE=error MSG="No input shaper result found - check the console output of SHAPER_CALIBRATE"
    {% endif %}

# Old names
[gcode_macro ADXL_X]
description: Old name, use SHAPER_CALIBRATE_SV04 AXIS=X TOOL=0
gcode:
    SHAPER_CALIBRATE_SV04 AXIS=X TOOL=0

[gcode_macro ADXL_Y]
description: Old name, use SHAPER_CALIBRATE_SV04 AXIS=Y
gcode:
    SHAPER_CALIBRATE_SV04 AXIS=Y
