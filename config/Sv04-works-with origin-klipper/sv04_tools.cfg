########################################################################
# SV04 TOOLS
# Calibration wizards, Z offset handling, filament load/unload and a
# menu for Mainsail (>= 2.9) / Fluidd (>= 1.27) using macro prompts.
# Start with: SV04_MENU
########################################################################

########################################
# MENU
########################################

[gcode_macro SV04_MENU]
description: Menu with calibration and filament functions
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin SV04"
    RESPOND TYPE=command MSG="action:prompt_text Calibration (in this order the first time)"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 1. Z tilt|Z_TILT_HOME|info"
    RESPOND TYPE=command MSG="action:prompt_button 2. Bed screws|BED_LEVEL_SCREWS|info"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 3. Z offset T0|Z_OFFSET_CALIBRATE|primary"
    RESPOND TYPE=command MSG="action:prompt_button 4. Z offset T1|CALIBRATE_T1_Z|primary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button PID bed|PID_TUNE_BED|warning"
    RESPOND TYPE=command MSG="action:prompt_button PID T0|PID_TUNE_HOTEND TOOL=0|warning"
    RESPOND TYPE=command MSG="action:prompt_button PID T1|PID_TUNE_HOTEND TOOL=1|warning"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_text Filament (220 C, use the macro with TEMP=... for other values)"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load T0|LOAD_FILAMENT TOOL=0|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Unload T0|UNLOAD_FILAMENT TOOL=0|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Load T1|LOAD_FILAMENT TOOL=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Unload T1|UNLOAD_FILAMENT TOOL=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"

########################################
# Z OFFSET
########################################
# How the offsets work:
#  - T0: probe z_offset in printer.cfg (SAVE_CONFIG section).
#        Z_OFFSET_CALIBRATE measures it, SAVE_Z_OFFSET stores babysteps.
#  - T1: dual_z_offset in variables.cfg, relative to T0.
#        CALIBRATE_T1_Z measures it, SET_T1_OFFSET Z=... sets it by hand.
#  - Babysteps (Mainsail "Z offset" buttons) apply to both nozzles and are
#    cleared at the start of the next print unless saved with SAVE_Z_OFFSET.

[gcode_macro Z_OFFSET_CALIBRATE]
description: Guided Z offset calibration of T0 (paper test). BED_TEMP=60 NOZZLE_TEMP=150
gcode:
    {% set bed = params.BED_TEMP|default(60)|float %}
    {% set nozzle = params.NOZZLE_TEMP|default(150)|float %}
    RESPOND TYPE=command MSG=action:prompt_end
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="Z_OFFSET_CALIBRATE is not possible during a print"
    {% else %}
        _SV04_TOOL_OFFSET_RESET
        BED_MESH_CLEAR
        M140 S{bed}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={nozzle}
        G28
        RESPOND MSG="Heating bed and nozzle ..."
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={nozzle - 5}
        Z_TILT_ADJUST
        G28 Z
        G90
        # probe sits 25 mm behind the nozzle -> probe the bed centre
        G1 X150.5 Y125.5 F6000
        RESPOND MSG="Paper test: lower the nozzle with the buttons until the paper drags slightly, then ACCEPT"
        PROBE_CALIBRATE
        _SV04_WAIT_MANUAL_PROBE DONE=_SV04_Z_OFFSET_DONE
    {% endif %}

[gcode_macro _SV04_Z_OFFSET_DONE]
gcode:
    G91
    G1 Z10 F600
    G90
    {% if printer.configfile.save_config_pending %}
        _SV04_PROMPT_SAVE_CONFIG TITLE="Z offset T0" TEXT="New probe z_offset measured. SAVE_CONFIG stores it and restarts Klipper. Run CALIBRATE_T1_Z afterwards if you print with T1."
    {% else %}
        RESPOND MSG="Z offset calibration aborted - nothing changed"
    {% endif %}

[gcode_macro CALIBRATE_T1_Z]
description: Measure the Z offset of the right nozzle (T1) with a paper test. Calibrate T0 first. BED_TEMP=60 NOZZLE_TEMP=150
gcode:
    {% set bed = params.BED_TEMP|default(60)|float %}
    {% set nozzle = params.NOZZLE_TEMP|default(150)|float %}
    RESPOND TYPE=command MSG=action:prompt_end
    {% if printer.print_stats.state in ["printing", "paused"] %}
        RESPOND TYPE=error MSG="CALIBRATE_T1_Z is not possible during a print"
    {% else %}
        _SV04_TOOL_OFFSET_RESET
        BED_MESH_CLEAR
        M140 S{bed}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={nozzle}
        G28
        RESPOND MSG="Heating bed and nozzle T1 ..."
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed - 1}
        TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={nozzle - 5}
        Z_TILT_ADJUST
        G28 Z
        G90
        G1 Z5 F600
        T1
        G1 X150.5 Y150.5 F6000
        RESPOND MSG="Paper test with T1: lower the nozzle with the buttons until the paper drags slightly, then ACCEPT"
        MANUAL_PROBE
        _SV04_WAIT_MANUAL_PROBE DONE=_SV04_T1_Z_DONE
    {% endif %}

[gcode_macro _SV04_T1_Z_DONE]
gcode:
    # machine Z where T1 touches the paper = offset of T1 relative to T0
    {% set z = printer.toolhead.position.z|float %}
    G91
    G1 Z10 F600
    G90
    T0
    RESPOND MSG="Measured T1 Z offset: {'%.3f' % z} mm"
    RESPOND TYPE=command MSG="action:prompt_begin Z offset T1"
    RESPOND TYPE=command MSG="action:prompt_text Measured offset of T1 relative to T0: {'%.3f' % z} mm. Choose Discard if you pressed ABORT."
    {% if z|abs > 0.3 %}
        RESPOND TYPE=command MSG="action:prompt_text Note: more than 0.3 mm. COPY/MIRROR can not compensate this - consider adjusting the T1 hotend height mechanically."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Discard|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Save|SET_T1_OFFSET Z={'%.3f' % z}|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro SAVE_Z_OFFSET]
description: Store the current Z babystep permanently (probe z_offset, applies to both nozzles)
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    {% set applied = printer["gcode_macro _SV04_TOOL_OFFSET"].applied_z|float %}
    {% set baby = printer.gcode_move.homing_origin.z|float - applied %}
    {% if baby|abs < 0.0005 %}
        RESPOND MSG="No Z babystep active - nothing to save"
    {% else %}
        # remove the T1 tool offset for a moment so only the babystep is stored
        SET_GCODE_OFFSET Z_ADJUST={0.0 - applied}
        Z_OFFSET_APPLY_PROBE
        SET_GCODE_OFFSET Z_ADJUST={applied}
        RESPOND MSG="Babystep {'%.3f' % baby} mm moved into the probe z_offset"
        {% if printer.print_stats.state in ["printing", "paused"] %}
            RESPOND MSG="SAVE_CONFIG will be offered when the print has finished"
        {% else %}
            _SV04_PROMPT_SAVE_CONFIG TITLE="Z offset" TEXT="Babystep stored in the probe z_offset. SAVE_CONFIG writes it to printer.cfg and restarts Klipper."
        {% endif %}
    {% endif %}

########################################
# OTHER CALIBRATIONS
########################################

[gcode_macro Z_TILT_HOME]
description: Home all axes and align both Z motors
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    BED_MESH_CLEAR
    G28
    Z_TILT_ADJUST
    G28 Z

[gcode_macro BED_LEVEL_SCREWS]
description: Measure the bed screws with the probe and show how far to turn each screw
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    Z_TILT_HOME
    SCREWS_TILT_CALCULATE

[gcode_macro PID_TUNE_BED]
description: PID tune of the heated bed. TEMP=60
gcode:
    {% set temp = params.TEMP|default(60)|int %}
    RESPOND TYPE=command MSG=action:prompt_end
    RESPOND MSG="PID tuning bed at {temp} C - this takes several minutes"
    PID_CALIBRATE HEATER=heater_bed TARGET={temp}
    _SV04_PROMPT_SAVE_CONFIG TITLE="PID bed" TEXT="New PID values for the bed. SAVE_CONFIG stores them and restarts Klipper."

[gcode_macro PID_TUNE_HOTEND]
description: PID tune of a hotend. TOOL=0 (left) or 1 (right), TEMP=210, FAN=0.3 (part fan 0..1)
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set temp = params.TEMP|default(210)|int %}
    {% set fan_speed = params.FAN|default(0.3)|float %}
    {% set dcvars = printer["gcode_macro DC_VARS"] %}
    {% set heater = "extruder" if tool == 0 else "extruder1" %}
    {% set fan = dcvars.fan0 if tool == 0 else dcvars.fan1 %}
    RESPOND TYPE=command MSG=action:prompt_end
    RESPOND MSG="PID tuning T{tool} at {temp} C - this takes several minutes"
    SET_FAN_SPEED FAN={fan} SPEED={fan_speed}
    PID_CALIBRATE HEATER={heater} TARGET={temp}
    SET_FAN_SPEED FAN={fan} SPEED=0
    _SV04_PROMPT_SAVE_CONFIG TITLE="PID T{tool}" TEXT="New PID values for T{tool}. SAVE_CONFIG stores them and restarts Klipper."

########################################
# FILAMENT
########################################

[gcode_macro LOAD_FILAMENT]
description: Load filament. TOOL=0 (left) or 1 (right, default active tool), TEMP=220, LENGTH=50
gcode:
    {% set active = 0 if printer.toolhead.extruder == "extruder" else 1 %}
    {% set tool = params.TOOL|default(active)|int %}
    {% set length = [params.LENGTH|default(50)|float, 95]|min %}
    RESPOND TYPE=command MSG=action:prompt_end
    {% if printer.print_stats.state == "printing" %}
        RESPOND TYPE=error MSG="Pause the print first (M600 or PAUSE)"
    {% else %}
        _SV04_FILAMENT_HEAT TOOL={tool} TEMP={params.TEMP|default(0)}
        SAVE_GCODE_STATE NAME=_sv04_filament
        _SV04_FILAMENT_ACTIVATE TOOL={tool}
        M83
        G1 E{length} F300
        G1 E20 F150
        G1 E-1 F1800
        ACTIVATE_EXTRUDER EXTRUDER={printer.toolhead.extruder}
        RESTORE_GCODE_STATE NAME=_sv04_filament
        RESPOND MSG="Filament T{tool} loaded"
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload filament. TOOL=0 (left) or 1 (right, default active tool), TEMP=220, LENGTH=60
gcode:
    {% set active = 0 if printer.toolhead.extruder == "extruder" else 1 %}
    {% set tool = params.TOOL|default(active)|int %}
    {% set length = [params.LENGTH|default(60)|float, 95]|min %}
    RESPOND TYPE=command MSG=action:prompt_end
    {% if printer.print_stats.state == "printing" %}
        RESPOND TYPE=error MSG="Pause the print first (M600 or PAUSE)"
    {% else %}
        _SV04_FILAMENT_HEAT TOOL={tool} TEMP={params.TEMP|default(0)}
        SAVE_GCODE_STATE NAME=_sv04_filament
        _SV04_FILAMENT_ACTIVATE TOOL={tool}
        M83
        G1 E5 F300
        G1 E-15 F2400
        G4 P2000
        G1 E-{length} F1200
        ACTIVATE_EXTRUDER EXTRUDER={printer.toolhead.extruder}
        RESTORE_GCODE_STATE NAME=_sv04_filament
        RESPOND MSG="Filament T{tool} unloaded"
    {% endif %}

[gcode_macro _SV04_FILAMENT_HEAT]
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set synced = printer.dual_carriage.carriage_1 in ["COPY", "MIRROR"] %}
    {% set heaters = ["extruder", "extruder1"] if synced else (["extruder"] if tool == 0 else ["extruder1"]) %}
    {% for heater in heaters %}
        # keep the print temperature during a pause, otherwise use TEMP (default 220)
        {% set target = printer[heater].target|float %}
        {% set temp = params.TEMP|float if params.TEMP|float > 0 else (target if target >= 170 else 220.0) %}
        SET_HEATER_TEMPERATURE HEATER={heater} TARGET={temp}
    {% endfor %}
    {% for heater in heaters %}
        {% set target = printer[heater].target|float %}
        {% set temp = params.TEMP|float if params.TEMP|float > 0 else (target if target >= 170 else 220.0) %}
        TEMPERATURE_WAIT SENSOR={heater} MINIMUM={temp - 3}
    {% endfor %}

[gcode_macro _SV04_FILAMENT_ACTIVATE]
gcode:
    # In COPY/MIRROR extruder1 follows extruder, so both are moved together
    {% if printer.dual_carriage.carriage_1 in ["COPY", "MIRROR"] or params.TOOL|default(0)|int == 0 %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% else %}
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
    {% endif %}

########################################
# HELPERS
########################################

[gcode_macro _SV04_PROMPT_SAVE_CONFIG]
gcode:
    {% set title = params.TITLE|default("Save configuration") %}
    {% set text = params.TEXT|default("New values are pending. SAVE_CONFIG stores them and restarts Klipper.") %}
    RESPOND MSG="{title}: {text}"
    RESPOND TYPE=command MSG="action:prompt_begin {title}"
    RESPOND TYPE=command MSG="action:prompt_text {text}"
    RESPOND TYPE=command MSG="action:prompt_footer_button Later|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button SAVE_CONFIG|SAVE_CONFIG|primary"
    RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _SV04_END_PRINT_PROMPT]
gcode:
    {% if printer.configfile.save_config_pending %}
        _SV04_PROMPT_SAVE_CONFIG TITLE="Print finished" TEXT="Changed values (e.g. Z offset) are not saved yet. SAVE_CONFIG stores them and restarts Klipper."
    {% endif %}

# Run a macro as soon as the manual probe dialog (ACCEPT/ABORT) is closed
[gcode_macro _SV04_WAIT_MANUAL_PROBE]
variable_done: ""
gcode:
    SET_GCODE_VARIABLE MACRO=_SV04_WAIT_MANUAL_PROBE VARIABLE=done VALUE="'{params.DONE}'"
    UPDATE_DELAYED_GCODE ID=_SV04_MANUAL_PROBE_POLL DURATION=1

[delayed_gcode _SV04_MANUAL_PROBE_POLL]
gcode:
    {% if printer.manual_probe.is_active %}
        UPDATE_DELAYED_GCODE ID=_SV04_MANUAL_PROBE_POLL DURATION=1
    {% else %}
        {printer["gcode_macro _SV04_WAIT_MANUAL_PROBE"].done}
    {% endif %}
